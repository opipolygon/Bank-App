<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DRISHTI — OTT Homepage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  DRISHTI — DESIGN TOKENS  (dark, cinematic OTT system)        ║
  ╠══════════════════════════════════════════════════════════════╣
  ║  COLOR                                                        ║
  ║   --bg        #0b0b0d   app canvas (warm near-black)          ║
  ║   --surface   #16161a   cards / inputs / menus                ║
  ║   --surface-2 #1f1f25   raised surface                        ║
  ║   --line      rgba(255,255,255,0.08)  hairline borders        ║
  ║   --text      #f5f4f2   primary (warm white)                  ║
  ║   --text-2    62% white secondary                            ║
  ║   --text-3    42% white tertiary / captions                  ║
  ║   --accent    #ff3d57   primary action (Watch / active)       ║
  ║   --gold      #e8b25a   premium / original tags               ║
  ║   --live      #ff2d46   LIVE broadcast badge                  ║
  ║  TYPE                                                          ║
  ║   --font-display  Bricolage Grotesque (titles, headings)      ║
  ║   --font-ui       Plus Jakarta Sans (labels, body, meta)      ║
  ║   scale: 44/32/30 display · 19/17 section · 15/13/12 ui       ║
  ║  SPACING  8pt system → 4 8 12 16 20 28 (gutters = 20)         ║
  ║  RADIUS   sheet 24 · card 14–16 · chip 13 · pill 99           ║
  ║  ELEVATION  card 0 8 22 rgba(0,0,0,.4) · sheet 0 -20 50 .5    ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<style>
  :root {
    --bg: #0b0b0d;
    --surface: #16161a;
    --surface-2: #1f1f25;
    --line: rgba(255,255,255,0.08);
    --text: #f5f4f2;
    --text-2: rgba(245,244,242,0.62);
    --text-3: rgba(245,244,242,0.42);
    --accent: #ff3d57;
    --gold: #e8b25a;
    --live: #ff2d46;
    --font-ui: "Plus Jakarta Sans", system-ui, sans-serif;
    --font-display: "Bricolage Grotesque", var(--font-ui);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #c9c9cf;
    background:
      radial-gradient(1200px 600px at 50% -10%, #d6d6dc, transparent 60%),
      linear-gradient(180deg, #cfcfd5, #b9b9c0);
    font-family: var(--font-ui);
    padding: 28px 0;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { display: flex; align-items: center; justify-content: center; }

  /* hide scrollbars inside the app */
  .app-scroll::-webkit-scrollbar, .rail::-webkit-scrollbar { width: 0; height: 0; display: none; }
  .app-scroll, .rail { scrollbar-width: none; -ms-overflow-style: none; }

  /* press feedback */
  .press { transition: transform 0.12s ease, opacity 0.12s ease; -webkit-tap-highlight-color: transparent; }
  .press:active { transform: scale(0.95); opacity: 0.9; }
  .icon-btn { background: none; border: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .ghost-btn:active { opacity: 0.6; }
  button { font-family: inherit; }
  input::placeholder { color: var(--text-3); }

  /* live dot pulse */
  @keyframes livePulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
  .live-dot { animation: livePulse 1.4s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)

function IOSStatusBar({ dark = false, time = '9:41' }) {

          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>

function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999, position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)' : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',

      <div style={{ position: 'absolute', inset: 0, borderRadius: 9999, backdropFilter: 'blur(12px) saturate(180%)', WebkitBackdropFilter: 'blur(12px) saturate(180%)', background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)' }} />
      <div style={{ position: 'absolute', inset: 0, borderRadius: 9999, boxShadow: dark ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)' : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)', border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)' }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>{children}</div>
    </div>

}

function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{content}</div>

  );
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10, paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 16px' }}>
        {pillIcon(<svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}><path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>)}
        {trailingIcon && pillIcon(<svg width="22" height="6" viewBox="0 0 22 6"><circle cx="3" cy="3" r="2.5" fill={muted}/><circle cx="11" cy="3" r="2.5" fill={muted}/><circle cx="19" cy="3" r="2.5" fill={muted}/></svg>)}
      </div>
      <div style={{ padding: '0 16px', fontFamily: '-apple-system, system-ui', fontSize: 34, fontWeight: 700, lineHeight: '41px', color: text, letterSpacing: 0.4 }}>{title}</div>
    </div>

}

function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{ display: 'flex', alignItems: 'center', minHeight: 52, padding: '0 16px', position: 'relative', fontFamily: '-apple-system, system-ui', fontSize: 17, letterSpacing: -0.43 }}>
      {icon && <div style={{ width: 30, height: 30, borderRadius: 7, background: icon, marginRight: 12, flexShrink: 0 }} />}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && <svg width="8" height="14" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      {!isLast && <div style={{ position: 'absolute', bottom: 0, right: 0, left: icon ? 58 : 16, height: 0.5, background: sep }} />}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && <div style={{ fontFamily: '-apple-system, system-ui', fontSize: 13, color: hc, textTransform: 'uppercase', padding: '8px 36px 6px', letterSpacing: -0.08 }}>{header}</div>}
      <div style={{ background: bg, borderRadius: 26, margin: '0 16px', overflow: 'hidden' }}>{children}</div>
    </div>
  );
}

function IOSDevice({ children, width = 402, height = 874, dark = false, title, keyboard = false }) {
  return (
    <div style={{ width, height, borderRadius: 48, overflow: 'hidden', position: 'relative', background: dark ? '#000' : '#F2F2F7', boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)', fontFamily: '-apple-system, system-ui, sans-serif', WebkitFontSmoothing: 'antialiased' }}>
      <div style={{ position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)', width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50 }} />
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
      </div>
      <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60, height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end', paddingBottom: 8, pointerEvents: 'none' }}>
        <div style={{ width: 139, height: 5, borderRadius: 100, background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)' }} />
      </div>
    </div>
  );
}

Object.assign(window, { IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow });
</script>

<!-- ════════════════════════════════════════════════════════ tweaks-panel ══ -->
<script type="text/babel" data-presets="react">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);

  .twk-hd{display:flex;align-items:center;justify-content:space-between;

  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;

  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;box-sizing:border-box;width:100%;min-width:0;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  select.twk-field{padding-right:22px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2;overflow-wrap:anywhere}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;

  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
  .twk-chips{display:flex;gap:6px}
  .twk-chip{position:relative;appearance:none;flex:1;min-width:0;height:46px;
    padding:0;border:0;border-radius:6px;overflow:hidden;cursor:default;
    box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);
    transition:transform .12s cubic-bezier(.3,.7,.4,1),box-shadow .12s}
  .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.15)}
  .twk-chip>span{position:absolute;top:0;bottom:0;right:0;width:34%;display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}
  .twk-chip>span>i{flex:1;box-shadow:0 -1px 0 rgba(0,0,0,.1)}
  .twk-chip>span>i:first-child{box-shadow:none}
  .twk-chip svg{position:absolute;top:6px;left:6px;width:13px;height:13px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = { x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)), y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)) };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl"><span>{label}</span>{value != null && <span className="twk-val">{value}</span>}</div>
      {children}
    </div>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => { const v = typeof o === 'object' ? o.value : o; const l = typeof o === 'object' ? o.label : o; return <option key={v} value={v}>{l}</option>; })}
      </select>
    </TweakRow>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  return (
    <TweakRow label={label}>
      <div role="radiogroup" className="twk-seg" style={{ position: 'relative' }}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => <button key={o.value} type="button" role="radio" aria-checked={o.value === value} onClick={() => onChange(o.value)}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}
const __TwkCheck = ({ light }) => <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} /></svg>;

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" value={value} onChange={(e) => onChange(e.target.value)} style={{ width: 56, height: 22 }} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" data-on={on ? '1' : '0'} style={{ background: hero }} onClick={() => onChange(o)}>
              {sup.length > 0 && <span>{sup.map((c, j) => <i key={j} style={{ background: c }} />)}</span>}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakSelect, TweakRadio, TweakColor });
</script>

function HeroCarousel({ slides, isSaved, onToggleSave, onOpen, navTabs, activeTab, onTab }) {
  const [idx, setIdx] = React.useState(0);
  const [drag, setDrag] = React.useState(0);
  const [w, setW] = React.useState(402);
  const ref = React.useRef(null);
  const start = React.useRef(null);
  const n = slides.length;

  React.useEffect(() => { if (ref.current) setW(ref.current.offsetWidth); }, []);
  React.useEffect(() => { setIdx(0); }, [slides]);

  React.useEffect(() => {
    if (start.current !== null) return;
    const t = setInterval(() => setIdx((i) => (i + 1) % n), 5200);
    return () => clearInterval(t);
  }, [n, drag]);

  const down = (e) => { start.current = (e.touches ? e.touches[0].clientX : e.clientX); };
  const move = (e) => { if (start.current === null) return; const x = (e.touches ? e.touches[0].clientX : e.clientX); setDrag(x - start.current); };
  const up = () => {
    if (start.current === null) return;
    if (drag < -45 && idx < n - 1) setIdx(idx + 1);
    else if (drag > 45 && idx > 0) setIdx(idx - 1);
    start.current = null; setDrag(0);
  };

  const HERO_H = 566;
  return (
    <div style={{ position: 'relative', height: HERO_H, overflow: 'hidden', background: '#0b0b0d' }} ref={ref}>
      <div style={{ display: 'flex', height: '100%', width: n * 100 + '%', transform: `translateX(calc(${-idx * (100 / n)}% + ${drag}px))`, transition: start.current === null ? 'transform 0.5s cubic-bezier(0.22,1,0.36,1)' : 'none' }}
        onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up}
        onTouchStart={down} onTouchMove={move} onTouchEnd={up}>
        {slides.map((s) => (
          <div key={s.title} style={{ width: (100 / n) + '%', height: '100%', position: 'relative' }}>
            <Poster item={s} radius={0} showTitle={false} monogram />
            <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to top, #0b0b0d 2%, rgba(11,11,13,0.5) 26%, transparent 52%)' }} />
            <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, padding: '0 22px 16px', textAlign: 'center', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
              <div style={{ fontFamily: 'var(--font-ui)', fontSize: 11.5, fontWeight: 800, letterSpacing: 2.4, color: 'var(--gold)', marginBottom: 10 }}>{s.tagline}</div>
              <h1 style={{ margin: 0, fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 44, lineHeight: 0.96, letterSpacing: -1, color: '#fff', textShadow: '0 3px 18px rgba(0,0,0,0.5)' }}>{s.title}</h1>
              <div style={{ display: 'flex', alignItems: 'center', gap: 9, margin: '13px 0 11px', fontFamily: 'var(--font-ui)', fontSize: 12.5, fontWeight: 600, color: 'rgba(255,255,255,0.78)' }}>
                {s.genres.map((g, i) => (
                  <React.Fragment key={g}>
                    {i > 0 && <span style={{ width: 3, height: 3, borderRadius: 99, background: 'rgba(255,255,255,0.45)' }} />}
                    <span>{g}</span>
                  </React.Fragment>
                ))}
                <RatingPill>{s.rating}</RatingPill>
              </div>
              <p style={{ margin: '0 0 16px', maxWidth: 320, fontFamily: 'var(--font-ui)', fontSize: 13.5, lineHeight: 1.5, color: 'rgba(255,255,255,0.7)', textWrap: 'pretty' }}>{s.desc}</p>
              <div style={{ display: 'flex', alignItems: 'center', gap: 11 }}>
                <button className="press" onClick={() => onOpen(s)} style={{ display: 'flex', alignItems: 'center', gap: 8, height: 50, padding: '0 30px', borderRadius: 14, border: 'none', cursor: 'pointer', background: 'var(--accent)', color: '#fff', fontFamily: 'var(--font-ui)', fontWeight: 800, fontSize: 16, whiteSpace: 'nowrap', boxShadow: '0 8px 22px rgba(255,61,87,0.35)' }}>
                  <Icon name="play" size={19} color="#fff" /> Watch Now
                </button>
                <WatchBtn saved={isSaved(s.title)} onToggle={() => onToggleSave(s)} />
              </div>
              <div style={{ display: 'flex', gap: 6, marginTop: 18 }}>
                {slides.map((_, i) => (
                  <span key={i} onClick={() => setIdx(i)} style={{ height: 6, borderRadius: 99, cursor: 'pointer', width: i === idx ? 20 : 6, background: i === idx ? 'var(--accent)' : 'rgba(255,255,255,0.34)', transition: 'width 0.3s, background 0.3s' }} />
                ))}
              </div>
            </div>
          </div>
        ))}
      </div>
      <TopNav tabs={navTabs} active={activeTab} onTab={onTab} />
    </div>
  );
}

          <span style={{ fontFamily: 'var(--font-ui)', fontSize: 12.5, color: 'var(--text-3)' }}>5.4 GB of 32 GB used</span>
          <span style={{ fontFamily: 'var(--font-ui)', fontSize: 12.5, fontWeight: 600, color: 'var(--accent)' }}>Smart Downloads on</span>
        </div>
        <div style={{ height: 6, borderRadius: 99, background: 'var(--surface)', overflow: 'hidden' }}>
          <div style={{ width: '17%', height: '100%', background: 'linear-gradient(90deg, var(--accent), var(--gold))' }} />
        </div>
      </div>
      <div style={{ padding: '20px 20px 0', display: 'flex', flexDirection: 'column', gap: 16 }}>
        {items.map((it) => (
          <div key={it.title} onClick={() => onOpen(it)} className="press" style={{ display: 'flex', gap: 13, alignItems: 'center', cursor: 'pointer' }}>
            <div style={{ position: 'relative', width: 96, height: 64, borderRadius: 11, overflow: 'hidden', flexShrink: 0 }}><Poster item={it} radius={11} showTitle={false} /></div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 15.5, color: 'var(--text)' }}>{it.title}</div>
              <div style={{ fontFamily: 'var(--font-ui)', fontSize: 12.5, color: 'var(--text-3)', marginTop: 3, display: 'flex', alignItems: 'center', gap: 7 }}>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, color: '#46c98a' }}><Icon name="check" size={13} stroke={2.6} color="#46c98a" /> Downloaded</span>
                <span style={{ width: 3, height: 3, borderRadius: 99, background: 'var(--text-3)' }} />
                <span>{it.q} · {it.size}</span>
              </div>
            </div>
            <button className="press icon-btn" onClick={(e) => e.stopPropagation()}><Icon name="trash" size={19} color="var(--text-3)" /></button>
          </div>
        ))}
      </div>
    </div>
  );
}

function ProfileScreen({ watchCount }) {
  const menu = [
    ['My Watchlist', `${watchCount} titles`],
    ['Account & Subscription', 'Premium · 4K'],
    ['Playback & Downloads', null],
    ['Language', 'English · বাংলা'],
    ['Parental Controls', null],
    ['Help & Support', null],
  ];
  return (
    <div style={{ paddingBottom: 96 }}>
      <ScreenHeader title="Profile" />
      <div style={{ padding: '4px 20px 0', display: 'flex', alignItems: 'center', gap: 15 }}>
        <div style={{ width: 64, height: 64, borderRadius: 99, padding: 2.5, background: 'linear-gradient(145deg, var(--accent), var(--gold))' }}>
          <div style={{ width: '100%', height: '100%', borderRadius: 99, background: 'linear-gradient(150deg,#3a4250,#1a1f29)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 26, color: '#fff' }}>A</div>
        </div>
        <div>
          <div style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 21, color: 'var(--text)' }}>Arif Hossain</div>
          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, marginTop: 5, background: 'rgba(232,178,90,0.14)', border: '1px solid rgba(232,178,90,0.3)', borderRadius: 7, padding: '3px 9px' }}>
            <Icon name="star" size={13} color="var(--gold)" />
            <span style={{ fontFamily: 'var(--font-ui)', fontSize: 12, fontWeight: 700, color: 'var(--gold)' }}>Premium Member</span>
          </div>
        </div>
      </div>
      <div style={{ padding: '22px 20px 0' }}>
        <div style={{ display: 'flex', gap: 16 }}>
          {['Arif', 'Nadia', 'Kids', '+'].map((p, i) => (
            <div key={p} className="press" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7, cursor: 'pointer' }}>
              <div style={{ width: 52, height: 52, borderRadius: 14, background: i === 3 ? 'var(--surface)' : `linear-gradient(150deg, ${['#3a4250','#7a3bb0','#1f9e63'][i]}, #1a1f29)`, border: i === 0 ? '2px solid var(--accent)' : '1px solid var(--line)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: i === 3 ? 24 : 18, color: i === 3 ? 'var(--text-3)' : '#fff' }}>{i === 3 ? '+' : p[0]}</div>
              <span style={{ fontFamily: 'var(--font-ui)', fontSize: 11.5, color: 'var(--text-2)' }}>{i === 3 ? 'Add' : p}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{ padding: '24px 20px 0' }}>
        <div style={{ background: 'var(--surface)', borderRadius: 16, border: '1px solid var(--line)', overflow: 'hidden' }}>
          {menu.map((m, i) => (
            <button key={m[0]} className="press" style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 12, padding: '15px 16px', background: 'none', cursor: 'pointer', textAlign: 'left', border: 'none', borderBottom: i < menu.length - 1 ? '1px solid var(--line)' : 'none' }}>
              <span style={{ flex: 1, fontFamily: 'var(--font-ui)', fontSize: 15, color: 'var(--text)' }}>{m[0]}</span>
              {m[1] && <span style={{ fontFamily: 'var(--font-ui)', fontSize: 13, color: 'var(--text-3)' }}>{m[1]}</span>}
              <Icon name="chevron" size={16} color="var(--text-3)" />
            </button>
          ))}
        </div>
        <button className="press" style={{ width: '100%', marginTop: 16, height: 50, borderRadius: 14, background: 'none', border: '1px solid var(--line)', cursor: 'pointer', fontFamily: 'var(--font-ui)', fontWeight: 700, fontSize: 15, color: 'var(--accent)' }}>Sign Out</button>
      </div>
    </div>
  );
}

Object.assign(window, { SearchScreen, LiveScreen, DownloadsScreen, ProfileScreen, ALL_CONTENT });
</script>

<!-- ═══════════════════════════════════════════════════════════════ app ══ -->
<script type="text/babel" data-presets="react">
const ROWS_BY_CAT = {
  Home:   ['continue', 'trending', 'new', 'web', 'live', 'sports', 'bangla', 'recommended', 'genres', 'watchlist'],
  Series: ['continue', 'web', 'trending', 'recommended', 'genres', 'watchlist'],
  Movies: ['new', 'trending', 'bangla', 'recommended', 'genres', 'watchlist'],
  Live:   ['live', 'sports', 'trending', 'genres'],
  Sports: ['sports', 'live', 'trending', 'genres'],
};
function heroFor(cat) {
  if (cat === 'Series') return HERO.filter((h) => h.genre === 'Series');
  if (cat === 'Movies') return HERO.filter((h) => h.genre !== 'Series');
  return HERO;
}

function HomeScreen({ cat, onCat, wl, isSaved, toggleSave, onOpen }) {
  const rows = ROWS_BY_CAT[cat] || ROWS_BY_CAT.Home;
  const Section = ({ title, accent, children }) => (
    <div style={{ marginTop: 28 }}><SectionHeader title={title} accent={accent} />{children}</div>
  );

  const render = (row) => {
    switch (row) {
      case 'continue': return <Section key={row} title="Continue Watching"><Rail>{CONTINUE.map((it) => <ContinueCard key={it.title} item={it} onOpen={() => onOpen(it)} />)}</Rail></Section>;
      case 'trending': return <Section key={row} title="Trending in Bangladesh" accent><Rail gap={4}>{TRENDING.map((it, i) => <RankCard key={it.title} item={it} rank={i + 1} onOpen={() => onOpen(it)} />)}</Rail></Section>;
      case 'new': return <Section key={row} title="New Releases"><Rail>{NEW_RELEASES.map((it) => <MovieCard key={it.title} item={it} onOpen={() => onOpen(it)} />)}</Rail></Section>;
      case 'web': return <Section key={row} title="Popular Web Series"><Rail>{WEB_SERIES.map((it) => <WebSeriesCard key={it.title} item={it} onOpen={() => onOpen(it)} />)}</Rail></Section>;
      case 'live': return <Section key={row} title="Live TV" accent><Rail>{LIVE.map((it) => <LiveCard key={it.title} item={it} onOpen={() => onOpen(it)} />)}</Rail></Section>;
      case 'sports': return <Section key={row} title="Sports Highlights"><Rail>{SPORTS.map((it) => <SportsCard key={it.title} item={it} onOpen={() => onOpen(it)} />)}</Rail></Section>;
      case 'bangla': return <Section key={row} title="Bangla Movies"><Rail>{BANGLA_MOVIES.map((it) => <MovieCard key={it.title} item={it} onOpen={() => onOpen(it)} />)}</Rail></Section>;
      case 'recommended': return <Section key={row} title="Recommended For You"><Rail>{RECOMMENDED.map((it) => <MovieCard key={it.title} item={it} onOpen={() => onOpen(it)} />)}</Rail></Section>;
      case 'genres': return <Section key={row} title="Genres"><Rail>{GENRES.map((g) => <GenreChip key={g.label} label={g.label} tone={g.tone} />)}</Rail></Section>;
      case 'watchlist': if (!wl.length) return null; return <Section key={row} title="My Watchlist"><Rail>{wl.map((it) => <WatchlistCard key={it.title} item={it} onOpen={() => onOpen(it)} onRemove={() => toggleSave(it)} />)}</Rail></Section>;
      default: return null;
    }
  };

  return (
    <div style={{ paddingBottom: 96 }}>
      <HeroCarousel slides={heroFor(cat)} isSaved={isSaved} onToggleSave={toggleSave} onOpen={onOpen} navTabs={TOP_TABS} activeTab={cat} onTab={onCat} />
      {rows.map(render)}
    </div>
  );
}

function DetailSheet({ item, isSaved, toggleSave, onClose }) {
  const [show, setShow] = React.useState(false);
  React.useEffect(() => { const t = requestAnimationFrame(() => setShow(true)); return () => cancelAnimationFrame(t); }, []);
  const close = () => { setShow(false); setTimeout(onClose, 260); };
  if (!item) return null;
  const desc = item.desc || `${item.title} — a standout ${(item.genre || 'Bangla').toLowerCase()} title from across Bangladesh's finest, streaming now in crisp quality on DRISHTI.`;
  const tags = item.genres || [item.genre, 'Bangla', 'Drishti Original'].filter(Boolean);
  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 100 }}>
      <div onClick={close} style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.6)', opacity: show ? 1 : 0, transition: 'opacity 0.26s' }} />
      <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, maxHeight: '88%', background: 'var(--bg)', borderRadius: '24px 24px 0 0', overflow: 'hidden', transform: show ? 'translateY(0)' : 'translateY(102%)', transition: 'transform 0.34s cubic-bezier(0.22,1,0.36,1)', boxShadow: '0 -20px 50px rgba(0,0,0,0.5)' }}>
        <div style={{ position: 'relative', height: 230 }}>
          <Poster item={item} radius={0} showTitle={false} monogram />
          <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to top, var(--bg), transparent 60%)' }} />
          <div style={{ position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', width: 38, height: 4, borderRadius: 99, background: 'rgba(255,255,255,0.4)' }} />
          <button onClick={close} className="press icon-btn" style={{ position: 'absolute', top: 14, right: 14, width: 32, height: 32, borderRadius: 99, background: 'rgba(10,10,12,0.55)', backdropFilter: 'blur(6px)', WebkitBackdropFilter: 'blur(6px)', border: '1px solid rgba(255,255,255,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <span style={{ color: '#fff', fontSize: 18, lineHeight: 1 }}>×</span>
          </button>
          <div style={{ position: 'absolute', left: 20, bottom: 14, right: 20 }}>
            {item.tagline && <div style={{ fontFamily: 'var(--font-ui)', fontSize: 11, fontWeight: 800, letterSpacing: 2, color: 'var(--gold)', marginBottom: 7 }}>{item.tagline}</div>}
            <h2 style={{ margin: 0, fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 32, letterSpacing: -0.6, color: '#fff', lineHeight: 1 }}>{item.title}</h2>
          </div>
        </div>
        <div style={{ padding: '6px 20px 30px', overflowY: 'auto' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 9, marginBottom: 15, flexWrap: 'wrap' }}>
            {item.year && <span style={{ fontFamily: 'var(--font-ui)', fontSize: 13, color: 'var(--text-2)', fontWeight: 600 }}>{item.year}</span>}
            {item.rating && <RatingPill>{item.rating}</RatingPill>}
            {(item.meta || item.episodes) && <span style={{ fontFamily: 'var(--font-ui)', fontSize: 13, color: 'var(--text-2)' }}>{item.meta || `${item.episodes} Episodes`}</span>}
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3, fontFamily: 'var(--font-ui)', fontSize: 13, color: 'var(--text-2)', fontWeight: 600 }}><Icon name="star" size={13} color="var(--gold)" /> 4.6</span>
          </div>
          <div style={{ display: 'flex', gap: 10, marginBottom: 18 }}>
            <button className="press" style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, height: 52, borderRadius: 14, border: 'none', cursor: 'pointer', background: 'var(--accent)', color: '#fff', fontFamily: 'var(--font-ui)', fontWeight: 800, fontSize: 16, boxShadow: '0 8px 22px rgba(255,61,87,0.32)' }}>
              <Icon name="play" size={19} color="#fff" /> Watch Now</button>
            <WatchBtn saved={isSaved(item.title)} onToggle={() => toggleSave(item)} size="sm" />
            <button className="press icon-btn" style={{ width: 52, height: 52, borderRadius: 14, background: 'var(--surface)', border: '1px solid var(--line)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}><Icon name="download" size={21} color="var(--text)" /></button>
          </div>
          <p style={{ margin: '0 0 18px', fontFamily: 'var(--font-ui)', fontSize: 14.5, lineHeight: 1.6, color: 'var(--text-2)' }}>{desc}</p>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            {tags.map((t) => <span key={t} style={{ fontFamily: 'var(--font-ui)', fontSize: 12.5, fontWeight: 600, color: 'var(--text-2)', background: 'var(--surface)', border: '1px solid var(--line)', padding: '6px 12px', borderRadius: 9 }}>{t}</span>)}
          </div>
        </div>
      </div>
    </div>
  );
}

const TWEAK_DEFAULTS = { "accent": "#ff3d57", "posterStyle": "gradient", "display": "Bricolage Grotesque" };
const WL_KEY = 'drishti.watchlist.v1';
function loadWL() { try { return JSON.parse(localStorage.getItem(WL_KEY)) || []; } catch (e) { return []; } }

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [nav, setNav] = React.useState('Home');
  const [cat, setCat] = React.useState('Home');
  const [wl, setWl] = React.useState(loadWL);
  const [open, setOpen] = React.useState(null);
  const scrollRef = React.useRef(null);

  React.useEffect(() => { try { localStorage.setItem(WL_KEY, JSON.stringify(wl)); } catch (e) {} }, [wl]);
  React.useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty('--accent', t.accent);
    r.style.setProperty('--font-display', `"${t.display}", var(--font-ui)`);
  }, [t.accent, t.display]);

  const isSaved = (title) => wl.some((x) => x.title === title);
  const toggleSave = (item) => setWl((cur) => cur.some((x) => x.title === item.title)
    ? cur.filter((x) => x.title !== item.title)
    : [{ title: item.title, tone: item.tone, genre: item.genre, rating: item.rating }, ...cur]);

  const goNav = (key) => { setNav(key); if (scrollRef.current) scrollRef.current.scrollTop = 0; };
  const goCat = (c) => { setCat(c); if (scrollRef.current) scrollRef.current.scrollTop = 0; };

  let screen;
  if (nav === 'Home') screen = <HomeScreen cat={cat} onCat={goCat} wl={wl} isSaved={isSaved} toggleSave={toggleSave} onOpen={setOpen} />;
  else if (nav === 'Search') screen = <SearchScreen onOpen={setOpen} />;
  else if (nav === 'Live') screen = <LiveScreen onOpen={setOpen} />;
  else if (nav === 'Downloads') screen = <DownloadsScreen onOpen={setOpen} />;
  else screen = <ProfileScreen watchCount={wl.length} />;

  return (
    <PosterCtx.Provider value={t.posterStyle}>
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: 'var(--bg)' }}>
        <div ref={scrollRef} className="app-scroll" style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', position: 'relative', isolation: 'isolate' }}>
          {screen}
        </div>
        <BottomNav active={nav} onChange={goNav} />
        {open && <DetailSheet item={open} isSaved={isSaved} toggleSave={toggleSave} onClose={() => setOpen(null)} />}
      </div>
      <TweaksPanel>
        <TweakSection label="Brand" />
        <TweakColor label="Accent" value={t.accent} options={['#ff3d57', '#10b981', '#f59e0b', '#7c3aed', '#0ea5e9']} onChange={(v) => setTweak('accent', v)} />
        <TweakSelect label="Display font" value={t.display} options={['Bricolage Grotesque', 'Plus Jakarta Sans', 'Space Grotesk', 'DM Serif Display']} onChange={(v) => setTweak('display', v)} />
        <TweakSection label="Artwork" />
        <TweakRadio label="Poster style" value={t.posterStyle} options={['gradient', 'noir', 'stripe']} onChange={(v) => setTweak('posterStyle', v)} />
      </TweaksPanel>
    </PosterCtx.Provider>
  );
}

window.DrishtiApp = App;
</script>

<!-- ══════════════════════════════════════════════════════════════ root ══ -->
<script type="text/babel" data-presets="react">
function Root() {
  return (
    <window.IOSDevice dark>
      <window.DrishtiApp />
    </window.IOSDevice>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
